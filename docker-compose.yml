name: wcies

services:
  postgres:
    image: postgres:18-alpine
    container_name: wcies-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wcies
      POSTGRES_PASSWORD: wcies_dev_password
      POSTGRES_DB: wcies_dev
    ports:
      - '5432:5432'
    volumes:
      # PG18+ images require mounting /var/lib/postgresql (not .../data)
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wcies -d wcies_dev']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - wcies-network

  redis:
    image: redis:8-alpine
    container_name: wcies-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - wcies-network

  minio:
    image: minio/minio:latest
    container_name: wcies-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: wcies_minio_dev
      MINIO_ROOT_PASSWORD: wcies_minio_dev_secret
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - wcies-network

  minio-init:
    image: minio/mc:latest
    container_name: wcies-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set wcies http://minio:9000 wcies_minio_dev wcies_minio_dev_secret &&
      mc mb --ignore-existing wcies/wcies &&
      echo 'MinIO bucket wcies ready'
      "
    networks:
      - wcies-network

  # Web dev container (Sprint 6 decision #20): Vite dev server + HMR.
  # Source is bind-mounted so edits on the host hot-reload in the container.
  web-dev:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    container_name: wcies-web-dev
    profiles: ['web']
    environment:
      # /api and /health* calls are proxied by Vite to the host API.
      VITE_PROXY_TARGET: http://host.docker.internal:3000
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    networks:
      - wcies-network

volumes:
  postgres_data:
  minio_data:
  web_node_modules:

networks:
  wcies-network:
    name: wcies-network
