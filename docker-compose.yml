name: wcies

services:
  postgres:
    image: postgres:18-alpine
    container_name: wcies-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wcies
      POSTGRES_PASSWORD: wcies_dev_password
      POSTGRES_DB: wcies_dev
    ports:
      - '5432:5432'
    volumes:
      # PG18+ images require mounting /var/lib/postgresql (not .../data)
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wcies -d wcies_dev']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - wcies-network

  redis:
    image: redis:8-alpine
    container_name: wcies-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - wcies-network

  minio:
    image: minio/minio:latest
    container_name: wcies-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: wcies_minio_dev
      MINIO_ROOT_PASSWORD: wcies_minio_dev_secret
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - wcies-network

  minio-init:
    image: minio/mc:latest
    container_name: wcies-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set wcies http://minio:9000 wcies_minio_dev wcies_minio_dev_secret &&
      mc mb --ignore-existing wcies/wcies &&
      echo 'MinIO bucket wcies ready'
      "
    networks:
      - wcies-network

  # Web dev container (Sprint 6 decision #20): Vite dev server + HMR.
  # Source is bind-mounted so edits on the host hot-reload in the container.
  web-dev:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    container_name: wcies-web-dev
    profiles: ['dev']
    environment:
      # /api and /health* calls are proxied by Vite to the API container.
      # Set VITE_PROXY_TARGET=http://host.docker.internal:3000 in .env to
      # proxy an API that runs on the host instead.
      VITE_PROXY_TARGET: ${VITE_PROXY_TARGET:-http://api-dev:3000}
      # Windows bind mounts propagate no fs events: make Vite's watcher poll.
      CHOKIDAR_USEPOLLING: 'true'
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
      - web_nm_web:/app/apps/web/node_modules
      - web_nm_api:/app/apps/api/node_modules
      - web_nm_shared:/app/packages/shared/node_modules
      - web_nm_client:/app/packages/api-client/node_modules
      - web_nm_contracts:/app/packages/platform-contracts/node_modules
    # Public DNS: the host's proxy DNS intermittently returns unroutable
    # fake IPs. host-gateway pins host.docker.internal without DNS.
    dns: ['223.5.5.5', '119.29.29.29']
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - wcies-network

  # API dev container: nest start --watch with source bind-mounted.
  # Hot reload relies on TSC polling - Windows bind mounts propagate no fs
  # events, so watch mode must poll for file changes.
  api-dev:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    container_name: wcies-api-dev
    profiles: ['dev']
    env_file:
      - path: .env
        required: false
    environment:
      # In-container the API reaches the compose services by service name.
      DATABASE_URL: postgresql://wcies:wcies_dev_password@wcies-postgres:5432/wcies_dev
      REDIS_URL: redis://wcies-redis:6379
      # Presigned URLs are opened by browsers on the host (and on LAN devices).
      # Default keeps single-machine use working; for LAN access set
      # S3_ENDPOINT=http://<lan-ip>:9000 in .env - compose interpolation
      # forwards it here and it resolves from containers and browsers alike.
      S3_ENDPOINT: ${S3_ENDPOINT:-http://host.docker.internal:9000}
      # Sprint 9 T2 (decision 1/2): scheduled ORDER_SYNC polls every 300s by
      # default (scheduler floor is 60s). A store still has to opt in via
      # settings.sync.orderSyncEnabled - the toggle lives on the store page.
      # LISTING_SYNC stays manual-only (interval unset = 0 = off).
      ORDER_SYNC_INTERVAL_SECONDS: ${ORDER_SYNC_INTERVAL_SECONDS:-300}
      # Windows bind mounts propagate no fs events: make tsc watch poll.
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: RecursiveDirectoryUsingDynamicPolling
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
      - api_nm_api:/app/apps/api/node_modules
      - api_nm_web:/app/apps/web/node_modules
      - api_nm_shared:/app/packages/shared/node_modules
      - api_nm_client:/app/packages/api-client/node_modules
      - api_nm_contracts:/app/packages/platform-contracts/node_modules
    # Public DNS: the host's proxy DNS intermittently returns unroutable
    # fake IPs. host-gateway pins host.docker.internal without DNS.
    dns: ['223.5.5.5', '119.29.29.29']
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - wcies-network

  # OZON webhook 内网穿透（docs/integrations/ozon-webhook-tunnel.md）。
  # 出站长连接：本机零入站端口、不改路由器、不需要公网 IP。
  # ingress 只放行 webhook 路径，其余一律 404 —— webhook 端点无签名且是
  # @Public()，绝不能让 dev API 整口暴露到公网。
  #
  # 默认不启动（profile 未启用）：日常开发用 curl 直投本地 + replay 脚本，
  # 只有要接真实 OZON 投递时才 `pnpm tunnel:up`，缩小暴露窗口。
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: wcies-tunnel
    profiles: ['tunnel']
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      # credentials.json 是本地凭据，已在 .gitignore 中排除
      - ./docker/cloudflared:/etc/cloudflared:ro
    # 同 web-dev/api-dev：宿主代理 DNS 会间歇返回不可路由假 IP，
    # 而 cloudflared 必须解析 Cloudflare 边缘域名才能建连。
    dns: ['223.5.5.5', '119.29.29.29']
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - wcies-network

volumes:
  postgres_data:
  minio_data:
  web_node_modules:
  web_nm_web:
  web_nm_api:
  web_nm_shared:
  web_nm_client:
  web_nm_contracts:
  api_node_modules:
  api_nm_api:
  api_nm_web:
  api_nm_shared:
  api_nm_client:
  api_nm_contracts:

networks:
  wcies-network:
    name: wcies-network
