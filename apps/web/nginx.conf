# SPA hosting for the WCIES web build (BrowserRouter, not hash routing):
# unknown paths fall back to index.html so deep links work on refresh.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Long-cache fingerprinted assets; HTML must always revalidate.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
